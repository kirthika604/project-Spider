[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "project-spider"
version = "0.1.0"
description = "Describe the dataset you wish existed; Spider builds it from the web with a source for every value."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.25",
  "beautifulsoup4>=4.9",
  "PyYAML>=5.4",
]

[project.optional-dependencies]
ai = ["anthropic>=0.30"]
standardize = ["pint>=0.20", "dateparser>=1.1", "rapidfuzz>=3.0", "Unidecode>=1.3"]
files = ["openpyxl>=3.1", "pypdf>=3.0"]
export = ["pyarrow>=12.0", "Jinja2>=3.0"]
dashboard = ["streamlit>=1.28"]
parse = ["lxml>=4.9", "trafilatura>=1.6"]
dev = ["pytest>=7.0"]
all = ["anthropic>=0.30","pint>=0.20","dateparser>=1.1","rapidfuzz>=3.0","Unidecode>=1.3",
       "openpyxl>=3.1","pypdf>=3.0","streamlit>=1.28","lxml>=4.9","pytest>=7.0",
       "pyarrow>=12.0","Jinja2>=3.0"]

[project.scripts]
spider = "spider.cli:main"

[tool.setuptools.packages.find]
include = ["spider*"]

[tool.setuptools.package-data]
spider = ["store/*.sql", "ref/seed/*.csv", "ref/presets/*/*.csv",
          "ref/presets/*/*.md", "assets/*"]
