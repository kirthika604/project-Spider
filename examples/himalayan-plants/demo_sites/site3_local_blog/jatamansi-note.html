<h1>Nardostachys jatamansi</h1>

<p class="sci">Nardostachys jatamansi</p>
<p>Jatamansi has a heavy, sweet scent when the root is cut.</p>
<p class="altitude">Reported from 3,000 to 5,000 m.</p>
<p class="flowering">Flowering in July.</p>
<p>Found in Uttarkashi.</p>
<p>Used in perfume and as incense.</p>
